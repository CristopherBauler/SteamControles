<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Steam conectada</title>
  <style>
    body { font-family: Segoe UI, sans-serif; background: #12161d; color: #e8edf4; margin: 0; }
    main { max-width: 560px; margin: 12vh auto; background: #1a1f27; border: 1px solid #2b3240; border-radius: 16px; padding: 28px; }
    h1 { margin: 0 0 12px; font-size: 22px; }
    p { line-height: 1.5; color: #c5ccd6; }
    .ok { color: #3dd68c; font-weight: 700; }
    .warn { color: #f0c14b; }
    code { background: #243044; padding: 2px 6px; border-radius: 6px; }
    a { color: #4da3ff; }
  </style>
</head>
<body>
  <main id="box">
    <h1>Conectando…</h1>
    <p>A Steam está devolvendo o login oficial (OpenID). A senha não passa por este app.</p>
  </main>
  <script>
    (function () {
      const box = document.getElementById("box");
      function show(title, body, ok) {
        box.innerHTML = `<h1 class="${ok ? "ok" : ""}">${title}</h1>${body}`;
      }
      function extractSteamId(claimedId) {
        const match = String(claimedId || "").match(/\/openid\/id\/(\d{17})/);
        return match ? match[1] : null;
      }
      function queryParams() {
        const search = new URLSearchParams(window.location.search || "");
        if ([...search.keys()].length) return search;
        const hash = String(window.location.hash || "").replace(/^#/, "");
        return new URLSearchParams(hash.startsWith("?") ? hash.slice(1) : hash);
      }
      async function verifyOpenId(params) {
        const body = new URLSearchParams();
        for (const [key, value] of params.entries()) {
          if (key.startsWith("openid.")) body.set(key, value);
        }
        body.set("openid.mode", "check_authentication");
        const response = await fetch("https://steamcommunity.com/openid/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body,
          signal: AbortSignal.timeout(20000),
        });
        const text = await response.text();
        return /is_valid\s*:\s*true/i.test(text);
      }
      async function run() {
        const params = queryParams();
        const mode = params.get("openid.mode");
        if (mode === "cancel") {
          show("Login cancelado", "<p>Você cancelou na Steam. Volte e tente de novo, ou cole o SteamID64.</p>");
          setTimeout(() => { location.replace("index.html"); }, 2200);
          return;
        }
        if (mode === "error") {
          show(
            "Acesso negado",
            "<p>A Steam recusou este retorno (OpenID). Cole o SteamID64 ou a URL do perfil na tela inicial — a senha continua só na Steam.</p><p><a href=\"index.html\">Voltar</a></p>"
          );
          return;
        }
        const steamId = extractSteamId(params.get("openid.claimed_id") || params.get("openid.identity"));
        if (!steamId) {
          show(
            "Não conectou",
            "<p>A Steam não devolveu o SteamID (às vezes aparece <b>Acesso negado</b> se o retorno não for http://localhost).</p><p>Cole o SteamID64 na tela inicial. A wishlist precisa estar pública.</p><p><a href=\"index.html\">Voltar</a></p>"
          );
          return;
        }
        try {
          await verifyOpenId(params);
        } catch {
          // O redirect já veio da página oficial da Steam neste WebView.
        }
        try {
          localStorage.setItem("mld.openid", JSON.stringify({ steamId, at: Date.now() }));
        } catch (error) {
          show("Falha ao gravar", `<p>${String(error.message || error)}</p><p><a href="index.html">Voltar</a></p>`);
          return;
        }
        show(
          "Steam conectada",
          `<p>SteamID <code>${steamId}</code> gravado neste celular.</p>
           <p class="warn">A lista de desejos precisa estar <strong>pública</strong>.</p>
           <p>Voltando ao app…</p>`,
          true
        );
        setTimeout(() => { location.replace("index.html"); }, 900);
      }
      run().catch((error) => {
        show("Falha no login", `<p>${String(error.message || error)}</p><p><a href="index.html">Voltar</a></p>`);
      });
    })();
  </script>
</body>
</html>
